<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="theme-color" content="#f7faf6" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7faf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08100b" />
    <meta name="description" content="A1 and B1 vocabulary flashcards for the Goethe exam with multilingual meanings." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A1 &amp; B1 Vocabulary for Goethe</title>
    <style>
      html { background: #f7faf6; }
      body { margin: 0; }
      .app-loading { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 16px; background: #f7faf6; }
      .app-loading-balloon { display: block; width: 64px; height: 40px; object-fit: contain; transform: translate3d(0, 4px, 0); will-change: transform; backface-visibility: hidden; animation: app-loading-float 3.6s cubic-bezier(.45, 0, .55, 1) infinite; }
      .app-loading-credit { margin: 0; color: #6b756d; font: 400 12px/1.5 system-ui, sans-serif; letter-spacing: .08em; }
      :root[data-theme="dark"] { background: #08100b; }
      :root[data-theme="dark"] .app-loading { background: #08100b; }
      :root[data-theme="dark"] .app-loading-credit { color: #96a399; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { background: #08100b; }
        :root:not([data-theme="light"]) .app-loading { background: #08100b; }
        :root:not([data-theme="light"]) .app-loading-credit { color: #96a399; }
      }
      @keyframes app-loading-float { 0%, 100% { transform: translate3d(0, 4px, 0); } 50% { transform: translate3d(0, -4px, 0); } }
      @media (prefers-reduced-motion: reduce) { .app-loading-balloon { animation: none; transform: none; will-change: auto; } }
    </style>
    <script>
      ;(() => {
        const darkThemeColor = '#08100b'
        const lightThemeColor = '#f7faf6'
        const theme = window.localStorage.getItem('german-a1-theme')
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        const activeTheme = theme === 'dark' || theme === 'light' ? theme : prefersDark ? 'dark' : 'light'

        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme
        }

        document.documentElement.style.colorScheme = activeTheme
        document
          .querySelector('meta[name="theme-color"]:not([media])')
          ?.setAttribute('content', activeTheme === 'dark' ? darkThemeColor : lightThemeColor)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading">
        <img class="app-loading-balloon" src="/rubacava-balloon.png" width="64" height="40" alt="" aria-hidden="true" />
        <p class="app-loading-credit" dir="ltr">rubacava studio</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
